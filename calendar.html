<table><thead><tr><th>월<th>화<th>수<th>목<th>금<th>토<th style="color:red">일</tr></thead><tbody id="g"></tbody></table>
<div class="msg" id="msg"></div></div>
<script>
const SB_URL="https://xxmtxuhcdzidhrefrvwf.supabase.co", SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh4bXR4dWhjZHppZGhyZWZydndmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDQwODAyNTQsImV4cCI6MjA1OTY1NjI1NH0.TaCCDlJvKrif_pZY038Qkglip8h-Qqjp2w2GlKwvoVg", H={apikey:SB_KEY,Authorization:"Bearer "+SB_KEY};
const esc=s=>(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const get=async p=>{const r=await fetch(SB_URL+"/rest/v1/"+p,{headers:H});if(!r.ok)throw new Error(await r.text());return r.json()};
const st=()=>Object.fromEntries(new URLSearchParams(location.hash.slice(1)));
const pad=n=>String(n).padStart(2,"0"), $=id=>document.getElementById(id);
let av={},BL=[];
async function loadBlocked(){try{const r=await fetch("blocked.txt",{cache:"no-cache"});
  if(r.ok)BL=(await r.text()).split(/\r?\n/).map(s=>s.trim()).filter(s=>s&&!s.startsWith("#"))}catch(e){}}
function cell(c){
  const col=/^[#\w]+$/.test(c.color||"")?c.color:"black";
  const parts=(c.body||"").split(/<br\s*\/?>|\r?\n/i).map(p=>
    esc(p.replace(/\(([^()]+)\)/g,(m,n)=>BL.includes(n)?"":m))
      .replace(/\(([^()]+)\)/g,(m,n)=>av[n]?`<img src="ava/${av[n]}.gif" alt="${n}" title="${n}">`:m)).filter(x=>x.trim());
  return parts.length?`<span style="color:${col}">${parts.join("<br>")}</span>`:"";
}
async function render(){
  const s=st(); let y=+s.y,m=+s.m;
  if(!y||!m){const [l]=await get("attendance?select=event_date&event_date=not.is.null&order=event_date.desc&limit=1");
    [y,m]=l?l.event_date.split("-").map(Number):[new Date().getFullYear(),new Date().getMonth()+1]}
  const ny=m==12?y+1:y,nm=m==12?1:m%12+1,py=m==1?y-1:y,pm=m==1?12:m-1;
  const rows=await get(`attendance?select=id,event_date,color,body&event_date=gte.${y}-${pad(m)}-01&event_date=lt.${ny}-${pad(nm)}-01&order=id.asc`);
  const by={}; rows.forEach(r=>{const c=cell(r);if(c)(by[+r.event_date.slice(8,10)]=by[+r.event_date.slice(8,10)]||[]).push(c)});
  const we=(new Date(y,m-1,1).getDay()+6)%7, end=new Date(y,m,0).getDate(); let h="",d=1-we;
  while(d<=end){h+="<tr>";for(let i=0;i<7;i++,d++){
    if(d<1||d>end){h+="<td></td>";continue}
    h+=`<td><span class="d ${i==6?"sun":i==5?"sat":""}">${d}</span>${(by[d]||[]).join(" ")}</td>`}h+="</tr>"}
  $("g").innerHTML=h; $("ttl").innerHTML=`${y}년 <b>${m}</b>월 출석부`;
  $("prev").href=`#y=${py}&m=${pm}`; $("next").href=`#y=${ny}&m=${nm}`; document.title=`${y}년 ${m}월 출석부`;
  $("sy").value=y; $("sm").value=m; $("msg").textContent=Object.keys(by).length?"":"이 달에는 기록이 없습니다";
}
(async()=>{try{
  for(let i=2000;i<=2013;i++)$("sy").add(new Option(i+"년",i)); for(let i=1;i<=12;i++)$("sm").add(new Option(i+"월",i));
  $("sy").onchange=$("sm").onchange=()=>{location.hash=`y=${$("sy").value}&m=${$("sm").value}`};
  addEventListener("hashchange",()=>render().catch(x=>$("msg").textContent=x.message));
  (await get("avatars?select=name,file")).forEach(a=>av[a.name]=a.file);
  await loadBlocked(); await render();
}catch(x){$("msg").textContent="불러오기 실패: "+x.message}})();
</script></body></html>
